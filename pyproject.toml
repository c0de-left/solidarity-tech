[project]
name = "solidarity-tech"
version = "0.3.0"
description = "Data mappers for the Solidarity Tech CRM API: users, custom properties and notes as objects, and the requests that keep them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Forest Gregg" }]
keywords = ["solidarity-tech", "crm", "data-mapper", "organizing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://github.com/c0de-left/solidarity-tech"
Repository = "https://github.com/c0de-left/solidarity-tech"
Issues = "https://github.com/c0de-left/solidarity-tech/issues"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["solidarity_tech*"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
